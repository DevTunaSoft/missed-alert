name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: missed-alert-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run source regression checks
        run: python3 tests/source_regression.py

      - name: Run randomized reminder state-machine checks
        run: python3 tests/fuzz_reminder_model.py

      - name: Run randomized stress and retention model checks
        run: python3 tests/fuzz_stress_model.py

      - name: Run persistence hardening regression checks
        run: python3 tests/persistence_regression.py

      - name: Run Android lint and unit test tasks
        run: gradle :app:lintDebug :app:testDebugUnitTest --stacktrace

      - name: Print JVM test failure details
        if: failure()
        run: |
          find app/build/test-results/testDebugUnitTest -name "*.xml" -type f -print -exec cat {} \; || true

      - name: Publish JVM test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Prepare release signing key (if configured)
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret - building a DEBUG-signed APK instead"
          fi

      - name: Build signed release APK
        if: steps.sign.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build debug APK (no signing key configured)
        if: steps.sign.outputs.signed != 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK integrity, installed metadata and signature
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            APK="app/build/outputs/apk/release/app-release.apk"
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature-verification.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging-verification.txt
          grep -q "package: name='com.crewalert.missedalert' versionCode='7' versionName='1.2.4-pilot'" apk-badging-verification.txt
          grep -q "sdkVersion:'29'" apk-badging-verification.txt
          grep -q "targetSdkVersion:'36'" apk-badging-verification.txt
          grep -E '^application:.*icon=' apk-badging-verification.txt
          ICON_PATH=$(sed -n "s/^application:.* icon='\\([^']*\\)'.*/\\1/p" apk-badging-verification.txt | head -n 1)
          test -n "$ICON_PATH" || { echo "APK manifest missing launcher icon" >&2; exit 1; }
          ICON_BYTES=$(unzip -p "$APK" "$ICON_PATH" | wc -c)
          test "$ICON_BYTES" -gt 100 || {
            echo "APK icon resource invalid: $ICON_PATH" >&2; exit 1;
          }
          echo "APK icon verified: $ICON_PATH ($ICON_BYTES bytes)"
          if [ "$SIGNED" != "true" ]; then
            echo "::warning::APK VERIFIED but DEBUG-SIGNED. Not validated for updating previously signed enterprise installations."
          fi
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Verify signature
        if: steps.sign.outputs.signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Verifies|SHA-256|Signer #1 certificate DN"

      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk missed-alert.apk
            NOTE="Release-signed APK built from ${{ github.sha }}"
          else
            cp app/build/outputs/apk/debug/app-debug.apk missed-alert.apk
            NOTE="DEBUG-signed APK (no release key configured) built from ${{ github.sha }}"
          fi
          gh release delete latest --cleanup-tag -y || true
          gh release create latest missed-alert.apk --title "Latest build" --notes "$NOTE" --target "${{ github.sha }}"

      - name: Publish prerelease test APK for pilot branch
        if: github.ref == 'refs/heads/pilot/xcover-pro-reminder-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk missed-alert-xcover-pilot.apk
            echo "Signed using repository release keystore" > pilot-notes.txt
          else
            cp app/build/outputs/apk/debug/app-debug.apk missed-alert-xcover-pilot.apk
            echo "DEBUG-signed; pilot testing only" > pilot-notes.txt
          fi
          gh release create "pilot-${{ github.run_id }}" missed-alert-xcover-pilot.apk --title "XCover Pro reminder pilot ${{ github.run_number }}" --notes-file pilot-notes.txt --target "${{ github.sha }}" --prerelease
