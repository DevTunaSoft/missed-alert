name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prepare release signing key (if configured)
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret - building a DEBUG-signed APK instead"
          fi

      - name: Build signed release APK
        if: steps.sign.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build debug APK (no signing key configured)
        if: steps.sign.outputs.signed != 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify signature
        if: steps.sign.outputs.signed == 'true'
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Verifies|SHA-256|Signer #1 certificate DN"

      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk missed-alert.apk
            NOTE="Release-signed APK built from ${{ github.sha }}"
          else
            cp app/build/outputs/apk/debug/app-debug.apk missed-alert.apk
            NOTE="DEBUG-signed APK (no release key configured) built from ${{ github.sha }}"
          fi
          gh release delete latest --cleanup-tag -y || true
          gh release create latest missed-alert.apk --title "Latest build" --notes "$NOTE" --target "${{ github.sha }}"
